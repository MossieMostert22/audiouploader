name: audiobook_uploader
description: Upload MP3 files to Google Drive

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_sign_in: ^6.3.0
  googleapis: ^12.0.0
  file_picker: ^8.3.7
  permission_handler: ^11.4.0
  http: ^1.2.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/background.png
    - assets/loader.png